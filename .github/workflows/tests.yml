name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Include pinned browser setup and slow hosted Windows disk flushes in
    # the budget while retaining the complete durable recovery suite.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"
        include:
          - os: macos-latest
            python-version: "3.10"
            managed-python: true
          - os: windows-latest
            python-version: "3.10"
            managed-python: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ !matrix.managed-python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The runner's Python 3.10 on these platforms lacks the T3 FTS5 options.
      - name: Set up managed Python with current SQLite
        if: matrix.managed-python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        env:
          UV_PYTHON_PREFERENCE: only-managed
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install package
        if: ${{ !matrix.managed-python }}
        run: python -m pip install --disable-pip-version-check -e .

      - name: Install package in managed environment
        if: matrix.managed-python
        run: uv pip install -e .

      - name: Verify SQLite support for the T3 search index
        shell: bash
        run: |
          python - <<'PY'
          from contextlib import closing
          import sqlite3
          import sys

          from local_agent_record_janitor.t3code_store import CONTRACT

          print(f"Python {sys.version.split()[0]}, SQLite {sqlite3.sqlite_version}", flush=True)
          ddl = next(sql for _, name, _, sql in CONTRACT["objects"]
                     if name == "orchestration_v2_message_search")
          with closing(sqlite3.connect(":memory:")) as db:
              db.execute(ddl)
          PY

      - name: Set up pinned LevelDB runtime host
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install exact Office LevelDB dependency
        env:
          LARJ_LEVELDB_RUNTIME: ${{ runner.temp }}/larj-leveldb-runtime
        run: python -m local_agent_record_janitor.office_leveldb --install

      - name: Install hash-pinned Paseo browser test dependency
        if: matrix.os == 'windows-latest'
        run: python -m tests.install_paseo_electron "${{ runner.temp }}/larj-paseo-electron"

      - name: Run unit tests
        env:
          LARJ_LEVELDB_RUNTIME: ${{ runner.temp }}/larj-leveldb-runtime
          LARJ_REQUIRE_LEVELDB_TESTS: "1"
          LARJ_PASEO_ELECTRON_RUNTIME: ${{ runner.temp }}/larj-paseo-electron
          LARJ_REQUIRE_PASEO_BROWSER_TESTS: "1"
        run: python -m unittest discover -s tests -v

      - name: Set up pinned Rust fingerprint oracle
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: rustup toolchain install 1.92.0 --profile minimal

      - name: Compare Herdr fingerprints with upstream serializer
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          RUSTUP_TOOLCHAIN: "1.92.0"
        run: python -m tests.herdr_fingerprint_oracle
